[project]
name = "wificsi-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
wificsi-server = "wificsi.server:main"
wificsi-simulator = "wificsi.simulator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/wificsi"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "server"]
