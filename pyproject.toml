[project]
name = "wificsi-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.31,<1",
    "websockets>=12,<16",
    "pydantic>=2.8,<3",
]

[project.scripts]
wificsi-server = "wificsi.server:main"
wificsi-simulator = "wificsi.simulator:main"
wificsi-dashboard = "wificsi.web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/wificsi"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "server"]
