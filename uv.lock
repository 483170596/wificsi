name = "wificsi-tools"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "pydantic" },
    { name = "uvicorn" },
    { name = "websockets" },
]

[package.dev-dependencies]
dev = [
    { name = "httpx" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.115,<1" },
    { name = "pydantic", specifier = ">=2.8,<3" },
    { name = "uvicorn", specifier = ">=0.31,<1" },
    { name = "websockets", specifier = ">=12,<16" },
]

[package.metadata.requires-dev]
dev = [
    { name = "httpx", specifier = ">=0.27,<1" },
    { name = "pytest", specifier = ">=8.4,<9" },
]
